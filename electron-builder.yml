appId: com.shazam.ai
productName: Shazam AI
copyright: Copyright © 2026 Shazam AI

directories:
  output: dist-desktop
  buildResources: desktop

# The desktop app only needs Electron + Node built-ins (bridge-core.js has no dependencies),
# so never bundle the web app's node_modules.
files:
  - desktop/**/*
  - cli/**/*
  - package.json
  - "!node_modules/**/*"
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  icon: desktop/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  darkModeSupport: true
  identity: null # build unsigned for direct local macOS installation

dmg:
  title: Shazam AI Installer
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
