<!doctype html>
<html><head><meta charset="utf-8" />
<style>
  body { width: 320px; margin: 0; padding: 14px; font: 12px/1.5 -apple-system, system-ui, sans-serif; background: #0a0c10; color: #e4e4e7; }
  h1 { font-size: 14px; margin: 0; } p { color: #a1a1aa; margin: 4px 0; }
  input, textarea { width: 100%; box-sizing: border-box; background: #000; border: 1px solid #27272a; color: #e4e4e7; border-radius: 8px; padding: 7px 9px; margin-top: 6px; font: inherit; resize: vertical; }
  button { margin-top: 8px; width: 100%; background: #f59e0b; border: 0; border-radius: 8px; padding: 8px; font-weight: 600; cursor: pointer; }
  button.ghost { background: #18181b; color: #e4e4e7; font-weight: 500; }
  .pill { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: #27272a; }
  .ok { background: rgba(16,185,129,.15); color: #6ee7b7; }
  pre { background: #000; border-radius: 8px; padding: 8px; max-height: 140px; overflow: auto; white-space: pre-wrap; color: #a1a1aa; font-size: 10px; }
  label { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
  .err { color: #fca5a5; }
</style></head>
<body>
  <div style="display:flex;justify-content:space-between;align-items:center"><h1>Arcwork Browser Bridge</h1><span id="status" class="pill">…</span></div>
  <p>Your Arcwork agents can browse in a dedicated tab using your real sessions.</p>
  <div id="pair">
    <input id="server" placeholder="Server URL" />
    <input id="code" placeholder="Pairing code from Connections → Devices" maxlength="16" />
    <button id="pairBtn">Pair this browser</button>
    <p id="err" class="err"></p>
  </div>
  <div id="paired" style="display:none">
    <label><input type="checkbox" id="ask" style="width:auto;margin:0" /> Ask before every click or typing (recommended)</label>
    <p>Never types into password or payment fields.</p>
    <div style="margin-top:10px;">
      <div style="color:#a1a1aa;font-size:11px;margin-bottom:4px;">Always allow these sites (non-sensitive actions only, one per line)</div>
      <textarea id="hosts" rows="3" placeholder="One domain per line..."></textarea>
      <p style="margin-top:6px;font-size:10px;color:#a1a1aa;">Submit, apply, pay, delete and send actions always ask.</p>
    </div>
    <pre id="activity">—</pre>
    <button id="unpair" class="ghost">Unpair</button>
  </div>
  <script src="popup.js"></script>
</body></html>
